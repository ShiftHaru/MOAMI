// Run with --no-configuration-cache. Read selected artifacts, not the entire cache.
allprojects { target ->
    target.plugins.withId('com.android.application') {
        target.tasks.register('writeRuntimeInventory') {
            doLast {
                // Project modules have several AGP output variants; inventory external packages only.
                def artifacts = target.configurations.debugRuntimeClasspath.incoming.artifactView {
                    componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                }.artifacts.artifacts.collect {
                    def id = it.id.componentIdentifier
                    def extension = it.file.name.tokenize('.').last()
                    def stem = it.file.name.substring(0, it.file.name.length() - extension.length() - 1)
                    def prefix = "${id.module}-${id.version}"
                    def classifier = stem.startsWith(prefix + '-') ? stem.substring(prefix.length() + 1) : null
                    [coordinate: "${id.group}:${id.module}:${id.version}".toString(), type: extension, classifier: classifier, file: it.file.absolutePath]
                }.sort { it.coordinate }
                def output = target.layout.buildDirectory.file('reports/runtime-inventory.json').get().asFile
                output.parentFile.mkdirs()
                output.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(artifacts)), 'UTF-8')
                println output.absolutePath
            }
        }
    }
}
